<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Not found — Arpit Bhushan</title>
<style>
:root{--bg:#0d0d10;--fg:#f0f0f2;--dim:#9a9ba4;--accent:#ffd166;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;
  background:var(--bg);color:var(--fg);font:16px/1.7 var(--sans);
  padding:40px calc(24px + env(safe-area-inset-left,0px))}
.code{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin:0 0 16px}
h1{margin:0;font-size:clamp(1.7rem,7vw,2.6rem);letter-spacing:-.03em}
p{margin:16px auto 0;max-width:42ch;color:var(--dim)}
a{display:inline-flex;align-items:center;min-height:48px;margin-top:28px;padding:12px 24px;border-radius:11px;
  border:1px solid var(--accent);color:var(--accent);text-decoration:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
a:hover{background:var(--accent);color:var(--bg)}
</style>
</head>
<body>
<div>
  <p class="code">404</p>
  <h1>Nothing here</h1>
  <p>That address does not point at anything. If someone sent you a link, check it came through in one piece.</p>
  <a href="/comedy/">Go to the homepage</a>
</div>
</body>
</html>
